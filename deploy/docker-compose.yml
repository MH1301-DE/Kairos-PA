# =====================================================================
# Kairos — Deployment-Skizze
#
# Status: Entwurf. Zeigt Topologie, Netzwerktrennung und Abhängigkeiten.
# Secrets kommen aus einer .env-Datei außerhalb des Repos (chmod 600).
# Images sind in Produktion auf Digests zu pinnen, nicht auf Tags.
# =====================================================================

x-app-base: &app-base
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: kairos-app:${GIT_SHA:-dev}
  restart: unless-stopped
  env_file: [.env]
  environment:
    DATABASE_URL: postgresql+asyncpg://kairos:${POSTGRES_PASSWORD}@postgres:5432/kairos
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    KAIROS_KEK: ${KAIROS_KEK}          # Master Key — NIE in der DB, NIE im Repo
  depends_on:
    postgres: {condition: service_healthy}
    redis:    {condition: service_started}
  networks: [internal]
  security_opt: ["no-new-privileges:true"]

services:

  # ---------------------------------------------------------------- Edge
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal, edge]
    depends_on: [api, web]

  # ------------------------------------------------------------ Frontend
  web:
    build: {context: ../web}
    image: kairos-web:${GIT_SHA:-dev}
    restart: unless-stopped
    environment:
      PORT: "3000"
      ORIGIN: https://${DOMAIN}   # required by SvelteKit's form-action CSRF check
    networks: [internal]

  # --------------------------------------------------------------- API
  api:
    <<: *app-base
    # one worker only -- the scheduler runs in-process (ADR-0007)
    command: uvicorn kairos.api:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      migrate:  {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      redis:    {condition: service_started}

  # Migrationen laufen als One-Shot VOR dem App-Start, nie beim Applikationsstart
  migrate:
    <<: *app-base
    command: alembic upgrade heads
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  # ------------------------------------------------------------- Storage
  postgres:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: kairos
      POSTGRES_USER: kairos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kairos -d kairos"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]
    # BEWUSST kein ports:-Mapping — nur intern erreichbar.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --appendonly no --requirepass ${REDIS_PASSWORD}
    volumes: [redisdata:/data]
    networks: [internal]

  # =====================================================================
  # Zielbild laut docs/07-deployment-und-betrieb.md §1 -- noch nicht gebaut.
  # Siehe docs/superpowers/specs/2026-09-12-boot-lifecycle-design.md
  # "Bewusst nicht Teil dieser Spec" für die Begründung je Service:
  #   - worker/scheduler: keine Jobqueue im Code (arq ist keine Dependency,
  #     kairos.jobs/kairos.scheduler existieren nicht).
  #   - minio: kein Object-Storage-Code, FIT-Rohdaten werden nicht abgelegt.
  #   - backup: braucht erst eine Nutzerentscheidung zum Backup-Ziel
  #     (zweiter Standort/Anbieter, docs/07 §4.1).
  #   - uptime: eigenes künftiges Monitoring-Thema, baut auf /healthz auf.
  # Nicht kommentarlos löschen -- spätere Specs bauen auf dieser Skizze auf.
  #
  # worker:
  #   <<: *app-base
  #   command: arq kairos.jobs.WorkerSettings
  #   deploy: {replicas: 1}
  #
  # scheduler:
  #   <<: *app-base
  #   command: python -m kairos.scheduler
  #
  # minio:
  #   image: minio/minio
  #   restart: unless-stopped
  #   command: server /data
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_USER}
  #     MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
  #   volumes: [miniodata:/data]
  #   networks: [internal]
  #
  # backup:
  #   build: {context: ./backup}
  #   restart: unless-stopped
  #   env_file: [.env]
  #   volumes:
  #     - miniodata:/srv/minio:ro
  #   networks: [internal]
  #   # Läuft täglich 02:00: pg_dump + restic, verschlüsselt an zweiten Ort.
  #   # WICHTIG: Der KAIROS_KEK gehört NICHT in dieses Backup.
  #
  # uptime:
  #   image: louislam/uptime-kuma:1
  #   restart: unless-stopped
  #   volumes: [uptimedata:/app/data]
  #   networks: [internal]
  # =====================================================================

networks:
  edge:
  internal:
    internal: false   # Ausgehend nötig (Garmin, Google, LLM-API)

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
  # miniodata, uptimedata: siehe "Zielbild, noch nicht gebaut" oben.

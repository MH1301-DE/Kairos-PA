[alembic]
script_location = alembic
# no sqlalchemy.url here on purpose -- alembic/env.py's _get_url() falls
# through to kairos.config.settings.database_url (env-var driven), so dev,
# tests, and the deploy/docker-compose.yml `migrate` container all resolve
# to the correct host without duplicating the URL in two places.

[loggers]
keys = root,sqlalchemy,alembic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handlers]
keys = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatters]
keys = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
